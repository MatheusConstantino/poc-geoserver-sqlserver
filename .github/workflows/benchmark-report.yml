name: Benchmark Report

on:
  # Run manually to generate a fresh benchmark report
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios to run (all, B01, B07, ...)"
        required: false
        default: "all"
  # Also runs on pushes to master that touch benchmark scenarios or runner
  push:
    branches: [master]
    paths:
      - "benchmark/scenarios.json"
      - "benchmark/runner.ts"
      - "api/src/services/benchmark.service.ts"

jobs:
  benchmark:
    name: Run Benchmarks & Comment Results
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: cp .env.example .env

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: benchmark/package.json

      - name: Install runner deps
        working-directory: ./benchmark
        run: npm install

      - name: Start stack (databases + seed + API)
        run: |
          docker compose up -d sqlserver postgis
          echo "Waiting for databases to be healthy..."
          timeout 180 bash -c \
            'until [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose ps -q sqlserver))" = "healthy" ] && \
                   [ "$(docker inspect --format="{{.State.Health.Status}}" $(docker compose ps -q postgis))"   = "healthy" ]; \
             do sleep 5; done'
          docker compose up -d sqlserver-seed
          echo "Waiting for seed to complete..."
          timeout 300 bash -c \
            'until [ "$(docker compose ps sqlserver-seed --format json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0][\"State\"] if d else \"running\")" 2>/dev/null)" = "exited" ]; \
             do sleep 10; done' || true
          docker compose up -d api
          sleep 10

      - name: Wait for API health
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000/health | grep -q "healthy\|degraded"; do sleep 3; done'

      - name: Run benchmark runner
        working-directory: ./benchmark
        run: |
          npx tsx runner.ts \
            --api http://localhost:3000 \
            --out ./results \
            --warmup 2 \
            --iters 5 \
            --scenarios "${{ github.event.inputs.scenarios || 'all' }}"

      - name: Commit benchmark results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark/results/
          git commit -m "perf(benchmark): add results $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Tear down stack
        if: always()
        run: docker compose down

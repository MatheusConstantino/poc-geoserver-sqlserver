name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Docker Compose validation (no images pulled — syntax only)
  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid"

  # ---------------------------------------------------------------------------
  # Job 2: API lint + type-check
  # ---------------------------------------------------------------------------
  api-lint:
    name: API — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 3: Secrets scan — no credentials in tracked files
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          # Fail if any tracked file contains what looks like a real secret
          # (excludes .env.example which has safe placeholders)
          FOUND=$(git grep -iP \
            "(password|api_key|apikey|secret|token)\s*=\s*['\"][^\${}'\"][^'\"]{4,}['\"]" \
            -- ':!.env.example' ':!*.md' ':!*.json.example' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "Possible hardcoded secret detected:"
            echo "$FOUND"
            exit 1
          fi
          echo "No hardcoded secrets found."

  # ---------------------------------------------------------------------------
  # Job 4: Smoke test — verify the containerised API actually boots
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test — API /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start databases and wait for healthy
        run: docker compose up sqlserver postgis -d --wait --wait-timeout 300
        timeout-minutes: 8

      - name: Initialize SQL Server schema (tiny dataset — just enough to create geo_poc)
        run: |
          docker compose run --rm \
            -e SEED_POINTS_COUNT=10 \
            -e SEED_LINES_COUNT=10 \
            -e SEED_POLYGONS_COUNT=5 \
            -e SEED_INCONSISTENCIES_COUNT=5 \
            sqlserver-seed
        timeout-minutes: 3

      - name: Start API and wait for healthy
        run: docker compose up api -d --wait --wait-timeout 120
        timeout-minutes: 4

      - name: GET /health must return 200
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs api sqlserver postgis

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Job 5: Markdown lint — keep docs consistent
  # ---------------------------------------------------------------------------
  docs-lint:
    name: Docs — Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            specs/**/*.md
            README.md
          config: .markdownlint.json
